    notes: >-
      National (Saudi) consensus, not a Gulf-wide instrument, and not a
      formulary. Classified primary_guideline as a named national consensus
      statement, but it is a consensus document rather than a systematically
      graded guideline — weight it below iwCLL/EHA/NCCN/BSH on clinical
      thresholds, and above them on nothing except regional applicability.
      Closest available proxy for GCC practice; NOT a substitute for UAE,
      Qatar, Oman or Kuwait guidance, none of which was located.

