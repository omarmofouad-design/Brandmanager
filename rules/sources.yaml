    publisher: >-
      Journal of the National Comprehensive Cancer Network (JNCCN)
    version_or_year: "2026 (JNCCN 24(3), article p68); PMID 41825137"
    url_or_doi: "https://jnccn.org/view/journals/jnccn/24/3/article-p68.xml"
    access_date: "2026-09-06"
    access_method: not_obtained
