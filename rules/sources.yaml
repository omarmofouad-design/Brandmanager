    notes: >-
      POST-CUTOFF AND POTENTIALLY THE MOST CONSEQUENTIAL SINGLE READOUT for
      this tool's first-line logic — a three-arm randomised comparison of two
      fixed-duration regimens against continuous BTKi monotherapy. Search
      metadata reports a non-inferiority result on investigator-assessed PFS
      at ~34 months median follow-up. No efficacy figure from this trial may
      enter the tool until the paper is read. Note that guidelines published
      before this readout (gulf-consensus-2024, and possibly bsh-2025) cannot
      have accounted for it, whereas eha-2026 may have.

