# /rules/sources.yaml — Source register for the CLL decision-support tool
#
# STATUS: PROVISIONAL — NOT YET CONFIRMED BY THE PROJECT OWNER.
# Phase 1 (rule authoring) is gated on confirmation of this register.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE USING THE REGISTER
# ---------------------------------------------------------------------------
# Every entry below has access_method: not_obtained.
#
# This session's network egress policy blocks outbound HTTPS to every external
# host except GitHub. Document retrieval was attempted and refused at the
# proxy (HTTP 403 on CONNECT) for, among others: annalsofoncology.org,
# esmo.org, ashpublications.org, pmc.ncbi.nlm.nih.gov, pubmed.ncbi.nlm.nih.gov,
# onlinelibrary.wiley.com, accessdata.fda.gov, ema.europa.eu, nccn.org,
# jnccn.org, nejm.org, clinicaltrials.gov, b-s-h.org.uk, europepmc.org,
# doi.org. Keyword web search still functions and returns result metadata.
#
# CONSEQUENCE: I have identified these documents. I have not read any of them.
# The `verified` field on every entry records exactly what was established:
#
#   bibliographic_only  — title, authors, publisher, year, identifier were
#                         established from search-result metadata. The
#                         document's CONTENT is unread.
#   content_read        — the document was retrieved and read. (No entry
#                         currently holds this value.)
#
# Under the project's own sourcing rules, search-result metadata is a
# secondary channel. It is adequate to establish WHICH document is current.
# It is NOT adequate to establish what a document says. Therefore:
#
#   *** NO RULE MAY BE WRITTEN AGAINST ANY ENTRY IN THIS REGISTER UNTIL ITS
#   *** access_method BECOMES user_supplied OR web_fetch AND ITS verified
#   *** FIELD BECOMES content_read.
#
# The `reliability` field describes the INTRINSIC standing of the document
# (what it would be worth once read), not the strength of my current access
# to it. Access strength lives in access_method + verified. Do not conflate
# them: an entry may be reliability: primary_guideline and still be unusable
# because it is unread.
# ---------------------------------------------------------------------------

register_version: "0.2.0-provisional"
compiled_on: "2026-09-06"
compiled_by: "Claude (Phase 0 sourcing)"
confirmed_by_owner: false
gate_status: "Phase 1 blocked pending owner confirmation and document supply"

egress_note: >
  Outbound HTTPS is blocked by this environment's egress policy for all
  external hosts except GitHub. Zero source documents were retrieved over the
  network. See ACCESS-REQUESTS.md for the precise supply list.

drive_note: >
  0.2.0 adds the first document actually read: an institutional CLL protocol
  retrieved from the owner's Google Drive (oman-royal-hospital-2026). The
  Drive was searched for CLL material; the rest of what it holds is
  manufacturer-produced medical-affairs and promotional material and is
  recorded under `excluded_materials` rather than as sources. See
  CONFLICTS.md C-07 for the independence problem that creates.

