  - id: iwcll-2018
    title: >-
      iwCLL guidelines for diagnosis, indications for treatment, response
      assessment, and supportive management of CLL
    publisher: >-
      International Workshop on Chronic Lymphocytic Leukaemia (iwCLL),
      published in Blood (American Society of Hematology)
    version_or_year: "2018 (Blood 131(25):2745-2760)"
    url_or_doi: "10.1182/blood-2017-09-806398"
    access_date: "2026-09-06"
    access_method: not_obtained
    reliability: primary_guideline
    verified: bibliographic_only
    intended_use:
      - Diagnostic criteria for CLL/SLL/MBL
      - Indications for treatment (active disease criteria)
      - Response assessment criteria
      - MRD definitions
    notes: >-
      Search found no successor iwCLL consensus document. As of this access
      date, the 2018 edition still appears to be the standing iwCLL statement,
      making it EIGHT YEARS OLD and the oldest load-bearing source in the
      register. Whether the 2026 EHA guideline restates, amends or supersedes
      its treatment-initiation criteria is UNRESOLVED and is the single most
      important open question in Phase 0 — the tool's initiation logic depends
      on the answer. Do not assume iwCLL 2018 still governs initiation.
    open_questions:
      - "Is a post-2018 iwCLL update in existence or in press?"
      - "Does EHA 2026 defer to, restate, or modify the iwCLL 2018 initiation criteria?"

  - id: eha-2026
    title: >-
      EHA Guidelines on management of chronic lymphocytic leukemia and
      Richter transformation
    publisher: >-
      European Hematology Association (EHA), published in HemaSphere (Wiley)
    version_or_year: "2026 (HemaSphere 10(6):e70403; published 2026-06-10)"
    url_or_doi: "10.1002/hem3.70403"
    access_date: "2026-09-06"
    access_method: not_obtained
    reliability: primary_guideline
    verified: bibliographic_only
    intended_use:
      - Primary European recommendation set (first-line and relapsed)
      - Active surveillance and treatment-need assessment
      - Richter transformation pathway
    notes: >-
      *** THIS IS A POST-TRAINING-CUTOFF DOCUMENT AND IT CHANGES THE SOURCE
      HIERARCHY. *** Search metadata indicates the European CLL guideline has
      moved from ESMO to EHA: this 2026 edition is described as the first
      written on behalf of EHA, with EHA solely responsible for subsequent
      annual editions. It therefore supersedes the ESMO CLL guideline line
      (esmo-2020, esmo-2024-interim) as the current European source of record.
      I had no knowledge of this document before searching. It is the highest
      supply priority in ACCESS-REQUESTS.md.
    supersedes: [esmo-2020, esmo-2024-interim]
    authors_as_listed_in_search: >-
      Eichhorst B, Ghia P, Bosch F, Clifford R, Gregor M, Guieze R, Kater AP,
      Niemann CU, Pospisilova S, Robak T, Schuh A, Stamatopoulos K, Tadmor T,
      York N

  - id: nccn-cll-current
    title: >-
      NCCN Clinical Practice Guidelines in Oncology: Chronic Lymphocytic
      Leukemia / Small Lymphocytic Lymphoma
    publisher: "National Comprehensive Cancer Network (NCCN)"
    version_or_year: >-
      Latest version CONFIRMED by search: 2.2026 (released 2025-12-22).
      Version 1.2026 released 2025-10-10. WHETHER A LATER 2026 VERSION EXISTS
      AS OF THE ACCESS DATE IS UNVERIFIED — NCCN ships multiple versions a
      year and nccn.org is unreachable from this session.
    url_or_doi: "https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1478"
    access_date: "2026-09-06"
    access_method: not_obtained
    reliability: primary_guideline
    verified: bibliographic_only
    access_barrier: "Login-gated (free NCCN registration) AND egress-blocked"
    intended_use:
      - First-line and relapsed treatment algorithms
      - del(17p)/TP53 branch
      - Fixed-duration vs continuous vs MRD-guided regimen classification
    notes: >-
      Two structural changes reported in the v2.2026 update summary matter to
      this tool's design and must be checked against the document itself:
      (a) regimens are now explicitly classified time-limited vs continuous
      and fixed-duration vs MRD-guided — which maps directly onto a required
      tool output field; (b) the "Response Definitions After Treatment" table
      and the "Venetoclax: Recommended TLS Prophylaxis and Monitoring Based on
      Tumor Burden" table were REMOVED. If confirmed, NCCN no longer carries
      the TLS table, and TLS rules must be sourced from the venetoclax label
      (fda-venetoclax-uspi) rather than from NCCN. Do not build TLS logic
      against NCCN until this is confirmed.
    open_questions:
      - "What is the current version number as of 2026-09-06?"
      - "Confirm removal of the TLS and response-definition tables, and what replaced them."

